<html>

<head>
	<link type="text/css" rel="stylesheet" href="/style-guide/css/fluig-style-guide.min.css" />
	<script type="text/javascript" src="/portal/resources/js/jquery/jquery.js"></script>
	<script type="text/javascript" src="/portal/resources/js/jquery/jquery-ui.min.js"></script>
	<script type="text/javascript" src="/portal/resources/js/mustache/mustache-min.js"></script>
	<script type="text/javascript" src="/style-guide/js/fluig-style-guide.min.js" charset="utf-8"></script>
	<script type="text/javascript" src="G12-Carregamento.js" charset="utf-8"></script>
	<script type="text/javascript" src="G12-Main.js" charset="utf-8"></script>
</head>

<body>
	<div class="fluig-style-guide">
		<form name="form" role="form">
			<div class="panel panel-default">
				<div class="panel-heading">
					<h2 class="panel-title">G12 — Dados do Contrato</h2>
				</div>
				<div class="panel-body">

					<!-- Campos ocultos que guardam os parâmetros vindos do RM -->
					<input type="hidden" name="IdMov" id="IdMov">
					<input type="hidden" name="CodColigada" id="CodColigada">
					<input type="hidden" name="NumeroMov" id="NumeroMov">

					<!-- Indicador de carregamento -->
					<div id="loadingDados" style="display:none; margin-bottom: 16px;">
						<div class="alert alert-info">
							<i class="fa fa-spinner fa-spin"></i> Carregando dados do contrato...
						</div>
					</div>

					<!-- Mensagem de erro -->
					<div id="erroDados" style="display:none; margin-bottom: 16px;">
						<div class="alert alert-danger">
							<i class="fa fa-exclamation-triangle"></i>
							<strong>Erro ao carregar dados:</strong> <span id="msgErro"></span>
						</div>
					</div>

					<!-- IDENTIFICAÇÃO DO PROJETO -->
					<div class="panel panel-default" style="margin-bottom: 24px;">
						<div class="panel-heading">
							<h3 class="panel-title">
								<i class="fa fa-building" style="margin-right: 6px;"></i>
								Identificação do Projeto
							</h3>
						</div>
						<div class="panel-body">

							<div class="row">
								<div class="col-md-2">
									<div class="form-group">
										<label>Coligada</label>
										<input type="text" class="form-control" name="coligada" id="coligada" readonly>
									</div>
								</div>
								<div class="col-md-2">
									<div class="form-group">
										<label>Filial</label>
										<input type="text" class="form-control" name="filial" id="filial" readonly>
									</div>
								</div>
								<div class="col-md-2">
									<div class="form-group">
										<label>IDMOV</label>
										<input type="text" class="form-control" name="IDMOV_numero" id="IDMOV_numero"
											readonly>
									</div>
								</div>
								<div class="col-md-3">
									<div class="form-group">
										<label>ID Projeto</label>
										<input type="text" class="form-control" name="idprj" id="idprj" readonly>
									</div>
								</div>
								<div class="col-md-3">
									<div class="form-group">
										<label>CNPJ</label>
										<input type="text" class="form-control" name="cnpj" id="cnpj" readonly>
									</div>
								</div>

							</div>

							<div class="row">
								<div class="col-md-4">
									<div class="form-group">
										<label>Centro de Custo</label>
										<input type="text" class="form-control" name="centro_de_custo"
											id="centro_de_custo" readonly>
									</div>
								</div>
								<div class="col-md-4">
									<div class="form-group">
										<label>Código do Projeto</label>
										<input type="text" class="form-control" name="codigo_do_projeto"
											id="codigo_do_projeto" readonly>
									</div>
								</div>
								<div class="col-md-4">
									<div class="form-group">
										<label>Descrição do Projeto</label>
										<input type="text" class="form-control" name="descricao_projeto"
											id="descricao_projeto" readonly>
									</div>
								</div>
							</div>

							<div class="row">
								<div class="col-md-5">
									<div class="form-group">
										<label>Rua</label>
										<input type="text" class="form-control" name="rua_projeto" id="rua_projeto"
											readonly>
									</div>
								</div>
								<div class="col-md-2">
									<div class="form-group">
										<label>Número</label>
										<input type="text" class="form-control" name="numero_endereco_projeto"
											id="numero_endereco_projeto" readonly>
									</div>
								</div>
								<div class="col-md-3">
									<div class="form-group">
										<label>Bairro</label>
										<input type="text" class="form-control" name="bairro_projeto"
											id="bairro_projeto" readonly>
									</div>
								</div>
								<div class="col-md-2">
									<div class="form-group">
										<label>Complemento</label>
										<input type="text" class="form-control" name="complemento_projeto"
											id="complemento_projeto" readonly>
									</div>
								</div>
							</div>

							<div class="row">
								<div class="col-md-4">
									<div class="form-group">
										<label>Cidade</label>
										<input type="text" class="form-control" name="cidade_projeto"
											id="cidade_projeto" readonly>
									</div>
								</div>
								<div class="col-md-2">
									<div class="form-group">
										<label>Estado</label>
										<input type="text" class="form-control" name="estado_projeto"
											id="estado_projeto" readonly>
									</div>
								</div>
							</div>

						</div>
					</div>

					<!-- DETALHES DO CONTRATO -->
					<div class="panel panel-default">
						<div class="panel-heading">
							<h3 class="panel-title">
								<i class="fa fa-file-text" style="margin-right: 6px;"></i>
								Detalhes do Contrato
							</h3>
						</div>
						<div class="panel-body">

							<div class="row">
								<div class="col-md-3">
									<div class="form-group">
										<label>Número do Contrato</label>
										<input type="text" class="form-control" name="numero_contrato"
											id="numero_contrato" readonly>
									</div>
								</div>
								<div class="col-md-3">
									<div class="form-group">
										<label>Tipo de Contrato</label>
										<input type="text" class="form-control" name="tipo_contrato" id="tipo_contrato"
											readonly>
									</div>
								</div>
								<div class="col-md-3">
									<div class="form-group">
										<label>Número da Licitação</label>
										<input type="text" class="form-control" name="numero_licitacao"
											id="numero_licitacao" readonly>
									</div>
								</div>
								<div class="col-md-3">
									<div class="form-group">
										<label>Código do Cliente</label>
										<input type="text" class="form-control" name="codigo_cliente"
											id="codigo_cliente" readonly>
									</div>
								</div>
							</div>

							<div class="row">
								<div class="col-md-4">
									<div class="form-group">
										<label>Data do Contrato</label>
										<input type="text" class="form-control" name="data_contrato" id="data_contrato"
											readonly>
									</div>
								</div>
								<div class="col-md-4">
									<div class="form-group">
										<label>Data de Início</label>
										<input type="text" class="form-control" name="data_inicio_contrato"
											id="data_inicio_contrato" readonly>
									</div>
								</div>
								<div class="col-md-4">
									<div class="form-group">
										<label>Data de Término</label>
										<input type="text" class="form-control" name="data_termino" id="data_termino"
											readonly>
									</div>
								</div>
							</div>

							<div class="row">
								<div class="col-md-4">
									<div class="form-group">
										<label>Periodicidade de Medição</label>
										<input type="text" class="form-control" name="periodicidade_medicao"
											id="periodicidade_medicao" readonly>
									</div>
								</div>
								<div class="col-md-4">
									<div class="form-group">
										<label>Condição de Pagamento</label>
										<input type="text" class="form-control" name="condicao_pagamento"
											id="condicao_pagamento" readonly>
									</div>
								</div>
								<div class="col-md-4">
									<div class="form-group">
										<label>CNPJ do Cliente</label>
										<input type="text" class="form-control" name="cnpjCliente" id="cnpjCliente"
											readonly>
									</div>
								</div>
							</div>

							<div class="row">
								<div class="col-md-6">
									<div class="form-group">
										<label>Nome do Produto</label>
										<input type="text" class="form-control" name="nome_produto" id="nome_produto"
											readonly>
									</div>
								</div>
								<div class="col-md-6">
									<div class="form-group">
										<label>Código do Produto</label>
										<input type="text" class="form-control" name="codigo_produto"
											id="codigo_produto" readonly>
									</div>
								</div>
							</div>

						</div>
					</div>

					<!-- APROVACAO DO SETOR TECNICO  -->
					<div class="panel panel-default" style="margin-bottom: 16px;">
						<div class="panel-heading">
							<h2 class="panel-title">Aprovação do setor técnico</h2>
						</div>
						<div class="panel-body">
							<div class="row">
								<div class="col-md-12"><label for="ajusteSetorTecnico">Informações para ajuste</label>
									<textarea name="ajusteSetorTecnico" id="ajusteSetorTecnico"
										class="form-control"></textarea>
								</div>
							</div>
						</div>
					</div>

					<!-- VALIDACAO DE COTRATOS  -->
					<div class="panel panel-default">
						<div class="panel-heading">
							<h2 class="panel-title">Validação de contratos</h2>
						</div>
						<div class="panel-body">
							<div class="row">
								<div class="col-md-6">
									<div class="form-group">
										<label for="idmovContratos">IDMOV Recibo de serviço</label>
										<input type="zoom" class="form-control" id="idmovContratos" name="idmovContratos" data-zoom="{
											'datasetId':'G12-MOVIMENTOS-2102',
											'displayKey':'IDMOV',
											'maximumSelectionLength':'1',
											'placeholder':'SELECIONE UM IDMOV',
											'fields':[
												{
													'field':'IDMOV',
													'label':'IDMOV',
													'standard':'true'
												}
											]
										}">
									</div>
								</div>
							</div>
							<div class="row">
								<div class="col-md-12"><label for="ajusteContratos">Informações para ajuste</label>
									<textarea name="ajusteContratos" id="ajusteContratos"
										class="form-control"></textarea>
								</div>
							</div>
						</div>
					</div>

				</div>
			</div>
		</form>
	</div>



</body>

</html>
